<!doctype html>
<html lang="en"><meta charset="utf-8"><title>GoldBot2026 — Deriv Login</title>
<body style="font-family:system-ui;max-width:720px;margin:40px auto;padding:20px">
<h2>GoldBot2026</h2><p>Connect your Deriv account securely with OAuth 2.0 + PKCE.</p>
<button id="login" style="padding:12px 18px">Connect Deriv</button><p id="status"></p>
<script>
const CLIENT_ID="34B9I7nOjWmQkh09P5LHx";
const REDIRECT_URI="https://alameenahmed318-bit.github.io/pocket-option-auto-bot/oauth/callback/";
function b64url(bytes){return btoa(String.fromCharCode(...bytes)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
async function start(){
 const bytes=crypto.getRandomValues(new Uint8Array(64));
 const verifier=b64url(bytes);
 const hash=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier));
 const challenge=b64url(new Uint8Array(hash));
 const state=b64url(crypto.getRandomValues(new Uint8Array(24)));
 sessionStorage.setItem("deriv_code_verifier",verifier);
 sessionStorage.setItem("deriv_oauth_state",state);
 const u=new URL("https://auth.deriv.com/oauth2/auth");
 u.searchParams.set("response_type","code");u.searchParams.set("client_id",CLIENT_ID);
 u.searchParams.set("redirect_uri",REDIRECT_URI);u.searchParams.set("scope","trade");
 u.searchParams.set("state",state);u.searchParams.set("code_challenge",challenge);
 u.searchParams.set("code_challenge_method","S256");
 location.href=u.toString();
}
document.getElementById("login").onclick=start;
</script></body></html>
