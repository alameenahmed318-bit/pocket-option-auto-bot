<!doctype html>
<html lang="en"><meta charset="utf-8"><title>GoldBot2026 — OAuth Callback</title>
<body style="font-family:system-ui;max-width:760px;margin:40px auto;padding:20px">
<h2>Deriv connection</h2><pre id="out">Completing connection…</pre>
<script>
const CLIENT_ID="34B9I7nOjWmQkh09P5LHx";
const REDIRECT_URI="https://alameenahmed318-bit.github.io/pocket-option-auto-bot/oauth/callback/";
const out=document.getElementById("out");
(async()=>{
 try{
  const q=new URLSearchParams(location.search), code=q.get("code"), state=q.get("state");
  const savedState=sessionStorage.getItem("deriv_oauth_state"), verifier=sessionStorage.getItem("deriv_code_verifier");
  if(!code) throw new Error(q.get("error_description")||"No authorization code returned.");
  if(!state || state!==savedState) throw new Error("OAuth state mismatch.");
  if(!verifier) throw new Error("PKCE verifier missing. Start again from the Connect Deriv page.");
  const r=await fetch("https://auth.deriv.com/oauth2/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({grant_type:"authorization_code",client_id:CLIENT_ID,code,redirect_uri:REDIRECT_URI,code_verifier:verifier})});
  const d=await r.json();
  if(!r.ok) throw new Error(JSON.stringify(d));
  sessionStorage.removeItem("deriv_oauth_state");sessionStorage.removeItem("deriv_code_verifier");
  out.textContent="CONNECTED\n\nAccess token:\n"+(d.access_token||"")+
    "\n\nExpires in: "+(d.expires_in??"unknown")+" seconds\n\nIMPORTANT: do not share this token. Store it only as a GitHub Actions secret if you are testing.";
 }catch(e){out.textContent="Connection failed:\n"+e.message;}
})();
</script></body></html>
