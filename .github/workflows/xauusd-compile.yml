name: Compile XAUUSD Fast Scalper

on:
  workflow_dispatch:
  push:
    paths:
      - 'mql5/Experts/XAUUSD_FastScalper.mq5'
      - '.github/workflows/xauusd-compile.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare folders
        run: |
          mkdir -p mql5/Experts mql5/Include
          find mql5 -maxdepth 2 -type f -print

      - name: Compile with MT5 Docker
        run: |
          docker pull hudsonventura/mt5:2.3
          docker run --rm             -v "$GITHUB_WORKSPACE/mql5/Experts:/home/headless/.wine/drive_c/MQL5/Experts"             -v "$GITHUB_WORKSPACE/mql5/Include:/home/headless/.wine/drive_c/MQL5/Include:ro"             hudsonventura/mt5:2.3             /build.sh

      - name: Verify compiled EX5
        run: |
          echo "=== COMPILED FILES ==="
          find mql5/Experts -maxdepth 1 -type f -print
          test -s mql5/Experts/XAUUSD_FastScalper.ex5
          file mql5/Experts/XAUUSD_FastScalper.ex5
          ls -lh mql5/Experts/XAUUSD_FastScalper.ex5

      - name: Upload EX5
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD_FastScalper_EX5
          path: mql5/Experts/XAUUSD_FastScalper.ex5
          if-no-files-found: error
