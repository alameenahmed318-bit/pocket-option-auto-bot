name: Compile XAUUSD Fast Scalper

on:
  workflow_dispatch:
  push:
    paths:
      - 'mql5/Experts/XAUUSD_FastScalper.mq5'
      - '.github/workflows/xauusd-compile.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          mkdir -p mql5/Experts mql5/Include
          cp mql5/Experts/XAUUSD_FastScalper.mq5 XAUUSD_FastScalper.mq5

      - name: Compile with MetaTrader 5 Docker
        run: |
          docker pull hudsonventura/mt5:2.2
          docker run --rm             -v "$GITHUB_WORKSPACE:/workspace"             -w /workspace             hudsonventura/mt5:2.2             bash -lc 'mkdir -p /home/headless/.wine/drive_c/MQL5/Experts /home/headless/.wine/drive_c/MQL5/Include && cp /workspace/mql5/Experts/XAUUSD_FastScalper.mq5 /home/headless/.wine/drive_c/MQL5/Experts/ && cp -r /workspace/mql5/Include/. /home/headless/.wine/drive_c/MQL5/Include/ 2>/dev/null || true; /build.sh; echo "=== EX5 SEARCH INSIDE CONTAINER ==="; find /home/headless -type f -name "*.ex5" -print 2>/dev/null; find /workspace -type f -name "*.ex5" -print 2>/dev/null; echo "=== ALL COMPILED FILES ==="; find /home/headless/.wine -type f -mmin -10 2>/dev/null | grep -Ei "\.(ex5|ex4)$" || true'

      - name: Locate and copy EX5
        run: |
          echo "=== HOST EX5 SEARCH ==="
          find "$GITHUB_WORKSPACE" -type f -name '*.ex5' -print || true
          EX5="$(find "$GITHUB_WORKSPACE" -type f -name 'XAUUSD_FastScalper.ex5' | head -n 1)"
          if [ -z "$EX5" ]; then
            EX5="$(find "$GITHUB_WORKSPACE" -type f -name '*.ex5' | head -n 1)"
          fi
          if [ -z "$EX5" ]; then
            echo "ERROR: EX5 was not exported by compiler."
            exit 1
          fi
          cp "$EX5" "$GITHUB_WORKSPACE/mql5/Experts/XAUUSD_FastScalper.ex5"
          ls -lh "$GITHUB_WORKSPACE/mql5/Experts/XAUUSD_FastScalper.ex5"

      - name: Upload EX5
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD_FastScalper_EX5
          path: mql5/Experts/XAUUSD_FastScalper.ex5
          if-no-files-found: error
