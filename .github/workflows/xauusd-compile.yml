name: Compile XAUUSD Fast Scalper

on:
  workflow_dispatch:
  push:
    paths:
      - 'mql5/Experts/XAUUSD_FastScalper.mq5'
      - '.github/workflows/xauusd-compile.yml'

jobs:
  compile:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official MetaTrader 5 installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mt5setup.exe"
          if (!(Test-Path "$env:RUNNER_TEMP\mt5setup.exe")) { throw 'MT5 installer was not downloaded.' }

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $install = 'C:\MT5Build'
          if (Test-Path $install) { Remove-Item $install -Recurse -Force }
          Start-Process -FilePath "$env:RUNNER_TEMP\mt5setup.exe" -ArgumentList '/auto',('/path:"' + $install + '"') -Wait -NoNewWindow
          $meta = Get-ChildItem -Path $install -Filter 'metaeditor64.exe' -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$meta) { throw "metaeditor64.exe was not found under $install" }
          "METAEDITOR=$($meta.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MT5ROOT=$install" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "MetaEditor: $($meta.FullName)"

      - name: Prepare MQL5 source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'mql5\Experts\XAUUSD_FastScalper.mq5'
          if (!(Test-Path $source)) { throw "Source not found: $source" }
          $mql = Join-Path $env:MT5ROOT 'MQL5'
          New-Item -ItemType Directory -Force -Path (Join-Path $mql 'Experts') | Out-Null
          Copy-Item $source (Join-Path $mql 'Experts\XAUUSD_FastScalper.mq5') -Force

      - name: Compile with official MetaEditor
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:MT5ROOT 'MQL5\Experts\XAUUSD_FastScalper.mq5'
          & $env:METAEDITOR /compile:"$source" /log
          $log = [System.IO.Path]::ChangeExtension($source, '.log')
          if (Test-Path $log) { Get-Content $log -ErrorAction SilentlyContinue }
          $ex5 = Join-Path $env:MT5ROOT 'MQL5\Experts\XAUUSD_FastScalper.ex5'
          if (!(Test-Path $ex5)) { throw "EX5 was not created: $ex5" }
          if ((Get-Item $ex5).Length -le 0) { throw 'EX5 file is empty.' }
          Write-Host "EX5 READY: $ex5"
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE 'build') | Out-Null
          Copy-Item $ex5 (Join-Path $env:GITHUB_WORKSPACE 'build\XAUUSD_FastScalper.ex5') -Force

      - name: Upload EX5
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD_FastScalper_EX5
          path: build/XAUUSD_FastScalper.ex5
          if-no-files-found: error
