name: Compile XAUUSD Fast Scalper

on:
  workflow_dispatch:
  push:
    paths:
      - 'mql5/Experts/XAUUSD_FastScalper.mq5'
      - '.github/workflows/xauusd-compile.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Prepare compiler folders
        run: |
          mkdir -p mql5/Experts mql5/Include
          test -s mql5/Experts/XAUUSD_FastScalper.mq5
          echo "=== SOURCE ==="
          ls -lah mql5/Experts
          wc -l mql5/Experts/XAUUSD_FastScalper.mq5

      - name: Compile with official MT5 Docker compiler
        run: |
          docker pull hudsonventura/mt5:2.2
          docker run --rm             -v "$GITHUB_WORKSPACE/mql5/Experts:/home/headless/.wine/drive_c/MQL5/Experts"             -v "$GITHUB_WORKSPACE/mql5/Include:/home/headless/.wine/drive_c/MQL5/Include:ro"             hudsonventura/mt5:2.2 /build.sh

      - name: Verify EX5
        run: |
          echo "=== BUILD OUTPUT ==="
          find mql5/Experts -maxdepth 2 -type f -printf '%p %s bytes\n'
          test -s mql5/Experts/XAUUSD_FastScalper.ex5
          file mql5/Experts/XAUUSD_FastScalper.ex5

      - name: Upload EX5
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD_FastScalper_EX5
          path: mql5/Experts/XAUUSD_FastScalper.ex5
          if-no-files-found: error
