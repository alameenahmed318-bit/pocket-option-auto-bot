name: Deriv MT5 Real Forex Preflight (NO TRADING)

on:
  workflow_dispatch:

concurrency:
  group: deriv-mt5-real-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MetaTrader5 Python package
        run: python -m pip install --upgrade pip MetaTrader5

      - name: Install MetaTrader 5 terminal
        shell: powershell
        run: |
          $installer = "$env:TEMP\mt5setup.exe"
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/auto" -Wait

      - name: REAL MT5 Forex preflight
        env:
          MT5_REAL_LOGIN: ${{ secrets.MT5_REAL_LOGIN }}
          MT5_REAL_PASSWORD: ${{ secrets.MT5_REAL_PASSWORD }}
          MT5_REAL_SERVER: ${{ secrets.MT5_REAL_SERVER }}
        run: python -u mt5_preflight.py
