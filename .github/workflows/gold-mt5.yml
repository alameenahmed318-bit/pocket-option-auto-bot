name: GOLD MT5 DEMO BOT

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start Gold MT5 demo bot"
        required: true
        default: "YES"
        type: choice
        options:
          - "YES"
          - "NO"

jobs:
  gold:
    if: ${{ inputs.start == 'YES' }}
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secret
        shell: powershell
        env:
          DERIV_MT5_PASSWORD: ${{ secrets.DERIV_MT5_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DERIV_MT5_PASSWORD)) {
            throw "ACCOUNT ERROR: DERIV_MT5_PASSWORD secret is missing."
          }
          Write-Host "Password secret detected."

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "MT5"

          Invoke-WebRequest -Uri $url -OutFile $installer
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          Start-Process $installer -ArgumentList "/auto",("/path:" + $installDir) -Wait

          $terminal = Get-ChildItem $installDir -Recurse -Filter "terminal64.exe" | Select-Object -First 1
          if (-not $terminal) { throw "MT5 INSTALL ERROR: terminal64.exe was not installed." }

          "MT5_DIR=$($terminal.DirectoryName)" | Out-File $env:GITHUB_ENV -Encoding utf8
          Write-Host "MT5 installed."

      - name: Install Gold EA
        shell: powershell
        run: |
          $experts = Join-Path $env:MT5_DIR "MQL5\Experts"
          $presets = Join-Path $env:MT5_DIR "MQL5\Presets"
          New-Item -ItemType Directory -Force -Path $experts | Out-Null
          New-Item -ItemType Directory -Force -Path $presets | Out-Null

          $source = Join-Path $env:GITHUB_WORKSPACE "GoldFastEA.mq5"
          if (-not (Test-Path $source)) { throw "EA ERROR: GoldFastEA.mq5 was not found." }
          Copy-Item $source (Join-Path $experts "GoldFastEA.mq5") -Force

          $set = @"
Lots=0.01
ProfitTarget=0.10
MaxLoss=10.0
TrailStart=0.10
Giveback=0.05
ScanSeconds=2
FastEMA=9
SlowEMA=21
RSIPeriod=14
Magic=32432112
"@
          Set-Content -Path (Join-Path $presets "GoldFastEA.set") -Value $set -Encoding ascii

          $meta = Get-ChildItem $env:MT5_DIR -Recurse -Filter "metaeditor64.exe" | Select-Object -First 1
          if (-not $meta) { throw "EA ERROR: MetaEditor was not found." }

          $src = Join-Path $experts "GoldFastEA.mq5"
          & $meta.FullName /portable /compile:$src /log
          Start-Sleep -Seconds 3

          $ex5 = Get-ChildItem $env:MT5_DIR -Recurse -Filter "GoldFastEA.ex5" | Select-Object -First 1
          if (-not $ex5) { throw "EA ERROR: GoldFastEA.ex5 was not produced. Compilation failed." }

          Write-Host "GoldFastEA compiled successfully."

      - name: Create MT5 startup config
        shell: powershell
        env:
          DERIV_MT5_PASSWORD: ${{ secrets.DERIV_MT5_PASSWORD }}
        run: |
          $configDir = Join-Path $env:MT5_DIR "config"
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null

          $config = @"
[Common]
Login=32432112
Server=Deriv-Demo
Password=$env:DERIV_MT5_PASSWORD
KeepPrivate=1
NewsEnable=0

[Experts]
Enabled=1
AllowLiveTrading=1
AllowDllImport=0

[StartUp]
Expert=GoldFastEA
Symbol=XAUUSD
Period=M1
ExpertParameters=GoldFastEA.set
"@

          $configPath = Join-Path $configDir "gold.ini"
          Set-Content -Path $configPath -Value $config -Encoding ascii
          "MT5_CONFIG=$configPath" | Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Start MT5 Gold Bot
        shell: powershell
        run: |
          $terminal = Get-ChildItem $env:MT5_DIR -Recurse -Filter "terminal64.exe" | Select-Object -First 1
          if (-not $terminal) { throw "MT5 ERROR: terminal64.exe not found." }

          Start-Process $terminal.FullName -ArgumentList "/portable","/config:$env:MT5_CONFIG"
          Start-Sleep -Seconds 45

          if (-not (Get-Process terminal64 -ErrorAction SilentlyContinue)) {
            throw "MT5 ERROR: terminal stopped immediately after startup."
          }

          Write-Host "MT5 started."

      - name: VERIFY DERIV ACCOUNT LOGIN
        shell: powershell
        run: |
          $deadline = (Get-Date).AddSeconds(120)
          $connected = $false
          $accountError = $false
          $lastLogText = ""

          while ((Get-Date) -lt $deadline) {
            if (-not (Get-Process terminal64 -ErrorAction SilentlyContinue)) {
              throw "ACCOUNT ERROR: MT5 stopped before account login could be verified."
            }

            $logs = Get-ChildItem (Join-Path $env:MT5_DIR "logs") -Filter "*.log" -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 8

            foreach ($log in $logs) {
              $txt = Get-Content $log.FullName -Raw -ErrorAction SilentlyContinue
              if ($txt) { $lastLogText = $txt }

              if ($txt -match "authorization failed|invalid account|invalid password|account disabled|account blocked|login failed|failed to connect|connection failed|not authorized|wrong password|incorrect password") {
                $accountError = $true
              }

              if ($txt -match "connected|authorized|login|successfully connected|Deriv-Demo") {
                $connected = $true
              }
            }

            if ($accountError) {
              Write-Host "=== ACCOUNT LOGIN FAILED ==="
              Write-Host "The Deriv/MT5 account could not be authenticated."
              Write-Host "Check: Login=32432112, Server=Deriv-Demo, and DERIV_MT5_PASSWORD."
              Write-Host "Password value is never printed."

              foreach ($log in $logs | Select-Object -First 3) {
                Write-Host "----- $($log.Name) -----"
                Get-Content $log.FullName -Tail 80 -ErrorAction SilentlyContinue
              }

              throw "ACCOUNT LOGIN FAILED: Deriv MT5 rejected or could not establish the account connection."
            }

            if ($connected) {
              Write-Host "ACCOUNT LOGIN CHECK: connection/authentication message detected."
              break
            }

            Start-Sleep -Seconds 10
          }

          if (-not $connected) {
            Write-Host "=== ACCOUNT LOGIN TIMEOUT ==="
            Write-Host "No successful Deriv/MT5 account connection was detected within 120 seconds."
            Write-Host "Check Login=32432112, Server=Deriv-Demo, and DERIV_MT5_PASSWORD."

            $logs = Get-ChildItem (Join-Path $env:MT5_DIR "logs") -Filter "*.log" -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 3

            foreach ($log in $logs) {
              Write-Host "----- $($log.Name) -----"
              Get-Content $log.FullName -Tail 100 -ErrorAction SilentlyContinue
            }

            throw "ACCOUNT LOGIN FAILED: no verified Deriv MT5 connection within 120 seconds."
          }

      - name: Verify Gold EA
        shell: powershell
        run: |
          Start-Sleep -Seconds 20

          $logs = Get-ChildItem (Join-Path $env:MT5_DIR "logs") -Filter "*.log" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 8

          $ready = $false
          foreach ($log in $logs) {
            $txt = Get-Content $log.FullName -Raw -ErrorAction SilentlyContinue
            if ($txt -match "GOLD EA READY") { $ready = $true }
          }

          if (-not $ready) {
            Write-Host "=== EA STARTUP FAILED ==="
            foreach ($log in $logs | Select-Object -First 3) {
              Write-Host "----- $($log.Name) -----"
              Get-Content $log.FullName -Tail 100 -ErrorAction SilentlyContinue
            }
            throw "EA STARTUP FAILED: GOLD EA READY was not detected."
          }

          Write-Host "GOLD EA READY."

      - name: Keep bot running
        shell: powershell
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
            if (-not (Get-Process terminal64 -ErrorAction SilentlyContinue)) {
              throw "RUNTIME ERROR: MT5 stopped unexpectedly."
            }
            Write-Host "GOLD BOT RUNNING - $(Get-Date -Format o)"
          }

      - name: Upload MT5 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-mt5-logs-${{ github.run_id }}
          path: |
            ${{ env.MT5_DIR }}\logs\*.log
          if-no-files-found: warn
