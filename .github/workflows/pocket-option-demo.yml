name: Pocket Option Demo Data / Paper Trader

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Demo-data paper trader
        env:
          PO_SSID: ${{ secrets.PO_SSID }}
          DEMO_ONLY: "true"
          ASSET: "EURUSD_otc"
          PERIOD: "300"
          EXPIRATION: "60"
          STAKE: "1"
          MAX_TRADES_PER_RUN: "5"
        run: python bot.py
