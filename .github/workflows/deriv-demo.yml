name: Deriv Demo Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-deriv.txt
      - name: Run Deriv demo bot
        env:
          DEMO_ONLY: "true"
          DRY_RUN: "true"
          DERIV_TOKEN: ${{ secrets.DERIV_TOKEN }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
          DERIV_ACCOUNT_ID: ${{ secrets.DERIV_ACCOUNT_ID }}
          DERIV_SYMBOL: "frxEURUSD"
          STAKE_USD: "1"
          DURATION_SECONDS: "60"
          MAX_TRADES: "3"
          COOLDOWN_SECONDS: "90"
          MAX_DAILY_LOSS_USD: "3"
        run: python deriv_bot.py