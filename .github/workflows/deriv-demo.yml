name: Deriv Demo Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: deriv-demo-bot
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-deriv.txt
      - name: Run Deriv demo bot
        env:
          DEMO_ONLY: "true"
          DRY_RUN: "false"
          DERIV_TOKEN: ${{ secrets.DERIV_TOKEN }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
          DERIV_SYMBOL: "AUTO"
          STAKE_USD: "1"
          DURATION_SECONDS: "60"
          MAX_TRADES: "100"
          COOLDOWN_SECONDS: "30"
          MAX_DAILY_LOSS_USD: "50"
          EARLY_PROFIT_SECONDS: "1"
          TAKE_PROFIT_USD: "0.20"
        run: python -u deriv_bot.py
      - name: Upload Deriv trade log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deriv-trade-log-${{ github.run_id }}
          path: deriv_trades.log
          if-no-files-found: warn
