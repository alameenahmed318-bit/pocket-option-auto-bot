name: Deriv Demo Bot

on:
  workflow_dispatch:
  schedule:
    # Keep the bot running in long sessions during the weekday FX market.
    # Each session is allowed to run for just under 6 hours.
    - cron: "0 */6 * * 1-5"

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-deriv.txt
      - name: Run Deriv demo bot
        env:
          DEMO_ONLY: "true"
          # DEMO_ONLY stays true, so these are virtual-money Demo contracts.
          DRY_RUN: "false"
          DERIV_TOKEN: ${{ secrets.DERIV_TOKEN }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
          DERIV_SYMBOL: "frxEURUSD"
          STAKE_USD: "3"
          DURATION_SECONDS: "60"
          MAX_TRADES: "20"
          COOLDOWN_SECONDS: "30"
          MAX_DAILY_LOSS_USD: "15"
        run: python -u deriv_bot.py
