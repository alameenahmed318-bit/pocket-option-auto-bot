name: Deriv Demo Bot

on:
  workflow_dispatch:
  # Keep one long-lived runner alive. GitHub-hosted jobs have a hard 6-hour limit,
  # so the next scheduled run takes over after this run reaches its limit.
  schedule:
    - cron: "7 */6 * * *"

concurrency:
  group: deriv-demo-bot
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-deriv.txt
      - name: Run Deriv demo bot with automatic crash recovery
        env:
          DEMO_ONLY: "true"
          DRY_RUN: "false"
          DERIV_TOKEN: ${{ secrets.DERIV_TOKEN }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
          DERIV_SYMBOL: "AUTO"
          STAKE_USD: "1"
          ACCU_GROWTH_RATE: "0.03"
          CLOSE_AFTER_SECONDS: "2"
          PROFIT_TARGET_USD: "0.02"
          MAX_TRADES: "0"
          COOLDOWN_SECONDS: "2"
          STABLE_MARKETS_LIMIT: "5"
          MAX_DAILY_LOSS_USD: "50"
        run: |
          set +e
          restart_count=0
          while true; do
            restart_count=$((restart_count + 1))
            echo "=== DERIV BOT SUPERVISOR START #$restart_count ==="
            python -u deriv_bot.py
            rc=$?
            echo "=== DERIV BOT EXITED rc=$rc; automatic restart in 5s ==="
            sleep 5
          done
      - name: Upload Deriv trade log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deriv-trade-log-${{ github.run_id }}
          path: deriv_trades.log
          if-no-files-found: warn
