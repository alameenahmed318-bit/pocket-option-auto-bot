name: Deriv Demo Bot

on:
  # Manual start is still available, but normal operation is automatic.
  workflow_dispatch:
  schedule:
    # Start a new session automatically every 6 hours on weekdays.
    # Each session runs for up to 350 minutes, so sessions do not overlap.
    - cron: "0 */6 * * 1-5"

concurrency:
  group: deriv-demo-bot
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-deriv.txt
      - name: Run Deriv demo bot
        env:
          DEMO_ONLY: "true"
          # DEMO_ONLY stays true, so these are virtual-money Demo contracts.
          DRY_RUN: "false"
          DERIV_TOKEN: ${{ secrets.DERIV_TOKEN }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
          DERIV_SYMBOL: "frxEURUSD"
          STAKE_USD: "3"
          DURATION_SECONDS: "60"
          MAX_TRADES: "10"
          COOLDOWN_SECONDS: "30"
          MAX_DAILY_LOSS_USD: "15"
          EARLY_PROFIT_SECONDS: "5"
        run: python -u deriv_bot.py
