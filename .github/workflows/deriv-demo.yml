name: Deriv MT5 Gold Bot
on:
  workflow_dispatch:
  schedule:
    - cron: "7 */6 * * *"
concurrency:
  group: deriv-demo-bot
  cancel-in-progress: false
jobs:
  demo:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'
          $installer = "$env:TEMPmt5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $installDir = "$env:RUNNER_TEMPMT5"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          Start-Process $installer -ArgumentList '/auto',('/path:' + $installDir) -Wait
          $terminal = Get-ChildItem $installDir -Recurse -Filter 'terminal64.exe' | Select-Object -First 1
          if (-not $terminal) { throw 'MT5 terminal was not installed' }
          "MT5_PATH=$($terminal.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          Write-Host "MT5 terminal: $($terminal.FullName)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-deriv.txt
      - name: Start MT5 and connect account
        env:
          MT5_LOGIN: "32432112"
          MT5_SERVER: "Deriv-Demo"
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
        shell: powershell
        run: |
          if (-not $env:MT5_PATH) { throw 'MT5_PATH is missing' }
          $dir = Split-Path $env:MT5_PATH -Parent
          $p = Start-Process -FilePath $env:MT5_PATH -ArgumentList '/portable' -WorkingDirectory $dir -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { throw "MT5 exited immediately. ExitCode=$($p.ExitCode)" }
          Write-Host "MT5 process running: PID=$($p.Id)"
          python -u deriv_bot.py
      - name: Upload MT5 Gold trade log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deriv-mt5-gold-log-${{ github.run_id }}
          path: deriv_mt5_gold.log
          if-no-files-found: warn