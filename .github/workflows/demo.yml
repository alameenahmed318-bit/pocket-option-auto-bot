name: Pocket Option Demo Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Check Demo authentication
        env:
          POCKET_OPTION_SSID: ${{ secrets.POCKET_OPTION_SSID }}
          POCKET_OPTION_EMAIL: ${{ secrets.POCKET_OPTION_EMAIL }}
          POCKET_OPTION_PASSWORD: ${{ secrets.POCKET_OPTION_PASSWORD }}
        run: |
          if [ -n "$POCKET_OPTION_SSID" ]; then
            echo "AUTH MODE: Demo SSID"
          elif [ -n "$POCKET_OPTION_EMAIL" ] && [ -n "$POCKET_OPTION_PASSWORD" ]; then
            echo "AUTH MODE: Demo email/password"
          else
            echo "ERROR: Add Pocket Option Demo email/password or Demo SSID as GitHub Secrets."
            exit 1
          fi

      - name: Run demo bot
        env:
          POCKET_OPTION_SSID: ${{ secrets.POCKET_OPTION_SSID }}
          POCKET_OPTION_EMAIL: ${{ secrets.POCKET_OPTION_EMAIL }}
          POCKET_OPTION_PASSWORD: ${{ secrets.POCKET_OPTION_PASSWORD }}
          DEMO_ONLY: "true"
          STAKE: "1"
          TRADE_DURATION: "60"
          MAX_TRADES_PER_RUN: "3"
          MAX_DAILY_LOSS: "3"
          COOLDOWN_SECONDS: "60"
        run: python demo_connection_test.py
