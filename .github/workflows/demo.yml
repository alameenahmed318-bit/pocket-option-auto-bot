name: Pocket Option Demo Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run demo bot
        env:
          # GitHub Actions is separate from Railway.
          # Use the same Pocket Option Demo email/password as GitHub Secrets.
          # SSID is optional; the script can request a fresh Demo SSID.
          POCKET_OPTION_SSID: ${{ secrets.POCKET_OPTION_SSID }}
          POCKET_OPTION_EMAIL: ${{ secrets.POCKET_OPTION_EMAIL }}
          POCKET_OPTION_PASSWORD: ${{ secrets.POCKET_OPTION_PASSWORD }}
          DEMO_ONLY: "true"
          STAKE: "1"
          TRADE_DURATION: "60"
          MAX_TRADES_PER_RUN: "3"
          MAX_DAILY_LOSS: "3"
          COOLDOWN_SECONDS: "60"
        run: python demo_connection_test.py
