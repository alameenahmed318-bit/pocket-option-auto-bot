name: Deriv Gold Demo Bot\n\non:\n  workflow_dispatch:\n  schedule:\n    - cron: "17 */6 * * *"\n\nconcurrency:\n  group: deriv-gold-demo\n  cancel-in-progress: false\n\njobs:\n  gold-demo:\n    runs-on: ubuntu-latest\n    timeout-minutes: 350\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n      - name: Setup Python\n        uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n      - name: Install Deriv dependencies\n        run: pip install -r requirements-deriv.txt\n      - name: Run GOLD demo bot\n        env:\n          DERIV_TOKEN: ${{ secrets.DERIV_TOKEN }}\n          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}\n          DERIV_ACCOUNT_ID: ${{ secrets.DERIV_ACCOUNT_ID }}\n          DERIV_GOLD_SYMBOL: "AUTO"\n          STAKE_USD: "1"\n          DURATION_SECONDS: "60"\n          MAX_TRADES: "0"\n          COOLDOWN_SECONDS: "3"\n          MAX_DAILY_LOSS_USD: "15"\n          DRY_RUN: "false"\n        run: |\n          set +e\n          restart_count=0\n          while true; do\n            restart_count=$((restart_count + 1))\n            echo "=== DERIV GOLD DEMO SUPERVISOR START #$restart_count ==="\n            python -u deriv_gold_bot.py\n            rc=$?\n            echo "=== GOLD BOT EXITED rc=$rc; restarting in 5s ==="\n            sleep 5\n          done\n      - name: Upload GOLD trade log\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: deriv-gold-trade-log-${{ github.run_id }}\n          path: deriv_gold_trades.log\n          if-no-files-found: warn\n