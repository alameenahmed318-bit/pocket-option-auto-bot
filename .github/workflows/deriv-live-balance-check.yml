name: Deriv Live Connection Check

on:
  workflow_dispatch:

jobs:
  connection:
    runs-on: ubuntu-latest
    steps:
      - name: Verify LIVE token access without trading
        env:
          LIVE_DERIV_TOKEN: ${{ secrets.LIVE_DERIV_TOKEN }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
        run: |
          set -u
          if [ -z "${LIVE_DERIV_TOKEN:-}" ]; then
            echo "CONNECTION_CHECK: LIVE_DERIV_TOKEN is empty"
            exit 1
          fi
          if [ -z "${DERIV_APP_ID:-}" ]; then
            echo "CONNECTION_CHECK: DERIV_APP_ID is empty"
            exit 1
          fi

          echo "CONNECTION_CHECK: verifying LIVE API authentication only."
          echo "NO balance request. NO buy. NO sell."

          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w "%{http_code}"             -H "Authorization: Bearer $LIVE_DERIV_TOKEN"             -H "Deriv-App-ID: $DERIV_APP_ID"             -H "Accept: application/json"             "https://api.derivws.com/trading/v1/options/accounts")

          echo "HTTP_STATUS=$code"

          if [ "$code" = "200" ]; then
            echo "CONNECTION_CHECK: LIVE API request accepted."
            echo "CONNECTION_CHECK: no trading operation was performed."
            rm -f "$tmp"
            exit 0
          fi

          response=$(cat "$tmp")
          if [ "$code" = "403" ] && echo "$response" | grep -qi "Insufficient scopes"; then
            echo "CONNECTION_CHECK: LIVE token was recognized by Deriv."
            echo "CONNECTION_CHECK: token is missing the scope required by this account endpoint."
            echo "CONNECTION_CHECK: this is NOT a token-format/authentication failure."
            echo "CONNECTION_CHECK: NO buy. NO sell."
            rm -f "$tmp"
            exit 0
          fi

          if [ "$code" = "401" ]; then
            echo "CONNECTION_CHECK: LIVE token was rejected as invalid or unauthorised."
          else
            echo "CONNECTION_CHECK: LIVE API access was rejected."
          fi
          echo "Deriv response:"
          echo "$response"
          rm -f "$tmp"
          exit 1
