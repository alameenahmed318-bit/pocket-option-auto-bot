name: Deriv Live Balance Check

on:
  workflow_dispatch:

jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - name: Read ALL LIVE account balances only
        env:
          LIVE_DERIV_TOKEN: ${{ secrets.LIVE_DERIV_TOKEN }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
        run: |
          set -u
          if [ -z "${LIVE_DERIV_TOKEN:-}" ]; then
            echo "BALANCE_CHECK: LIVE_DERIV_TOKEN is empty"
            exit 1
          fi
          if [ -z "${DERIV_APP_ID:-}" ]; then
            echo "BALANCE_CHECK: DERIV_APP_ID is empty"
            exit 1
          fi

          echo "BALANCE_CHECK: reading ALL accounts linked to this token."
          echo "NO buy. NO sell. NO order. NO trade."

          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w "%{http_code}"             -H "Authorization: Bearer $LIVE_DERIV_TOKEN"             -H "Deriv-App-ID: $DERIV_APP_ID"             -H "Accept: application/json"             "https://api.derivws.com/trading/v1/options/accounts")

          echo "HTTP_STATUS=$code"

          if [ "$code" != "200" ]; then
            echo "BALANCE_CHECK: LIVE account read failed."
            cat "$tmp"
            rm -f "$tmp"
            exit 1
          fi

          python3 - "$tmp" <<'PY'
          import json, sys

          with open(sys.argv[1], "r", encoding="utf-8") as f:
              payload = json.load(f)

          accounts = payload.get("data", [])
          if isinstance(accounts, dict):
              accounts = [accounts]

          print(f"ACCOUNTS_RETURNED: {len(accounts)}")

          if not accounts:
              print("BALANCE_CHECK: No accounts returned for this token.")
              sys.exit(1)

          real = []
          for a in accounts:
              account_type = str(a.get("account_type", "unknown")).lower()
              account_id = a.get("account_id", "unknown")
              balance = a.get("balance", "unknown")
              currency = a.get("currency", "")
              status = a.get("status", "unknown")
              group = a.get("group", "unknown")

              print(
                  f"ACCOUNT: id={account_id} type={account_type} "
                  f"balance={balance} {currency} status={status} group={group}"
              )

              if account_type == "real":
                  real.append(a)

          print(f"REAL_ACCOUNTS_FOUND: {len(real)}")

          if real:
              for a in real:
                  print(
                      f"LIVE_BALANCE: account_id={a.get('account_id', 'unknown')} "
                      f"balance={a.get('balance', 'unknown')} "
                      f"{a.get('currency', '')} "
                      f"status={a.get('status', 'unknown')}"
                  )
          else:
              print("BALANCE_CHECK: No REAL account was returned for this token.")

          print("BALANCE_CHECK: completed. No trading operation was performed.")
          PY

          rm -f "$tmp"
