name: Deriv Live Balance Check

on:
  workflow_dispatch:

jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - name: Read LIVE balance only
        env:
          LIVE_DERIV_TOKEN: ${{ secrets.LIVE_DERIV_TOKEN }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
        run: |
          set -u
          if [ -z "${LIVE_DERIV_TOKEN:-}" ]; then
            echo "BALANCE_CHECK: LIVE_DERIV_TOKEN is empty"
            exit 1
          fi
          if [ -z "${DERIV_APP_ID:-}" ]; then
            echo "BALANCE_CHECK: DERIV_APP_ID is empty"
            exit 1
          fi

          echo "BALANCE_CHECK: reading LIVE account balance only."
          echo "NO buy. NO sell. NO order. NO trade."

          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w "%{http_code}"             -H "Authorization: Bearer $LIVE_DERIV_TOKEN"             -H "Deriv-App-ID: $DERIV_APP_ID"             -H "Accept: application/json"             "https://api.derivws.com/trading/v1/options/accounts")

          echo "HTTP_STATUS=$code"

          if [ "$code" != "200" ]; then
            echo "BALANCE_CHECK: LIVE account read failed."
            cat "$tmp"
            rm -f "$tmp"
            exit 1
          fi

          python3 - "$tmp" <<'PY'
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as f:
              payload = json.load(f)

          accounts = payload.get("data", [])
          if isinstance(accounts, dict):
              accounts = [accounts]

          real = [a for a in accounts if str(a.get("account_type", "")).lower() == "real"]

          if not real:
              print("BALANCE_CHECK: No REAL Options account returned.")
              sys.exit(1)

          for a in real:
              print(f"LIVE_BALANCE: {a.get('balance')} {a.get('currency', '')}".strip())
              print(f"ACCOUNT_STATUS: {a.get('status', 'unknown')}")
          PY

          rm -f "$tmp"
          echo "BALANCE_CHECK: completed. No trading operation was performed."
